{% extends "admin/change_list.html" %}
{% load i18n %}

{% block content %}
  {% if low_stock_items %}
  <div class="alert alert-warning">
    <h4>库存预警</h4>
    <p>以下商品库存低于阈值:</p>
    <ul>
      {% for item in low_stock_items %}
      <li>{{ item.title }} - 库存: {{ item.stock }} / 阈值: {{ item.stock_threshold }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
  {{ block.super }}
{% endblock %}
